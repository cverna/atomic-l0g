# Cost-control tiers
# =================
#
# Every repository declared in distros.yaml needs exactly one tier here.
# `sources validate` fails if a repo is untiered or if a repo is tiered but not
# declared -- the point is that the decision is always explicit.
#
#   core          releases, issues, PRs and comments
#   watch         releases plus issue/PR metadata
#   release-only  releases and tags only
#
# Promote a repository by moving one line. `core` is where the API budget goes.

tiers:
  core:
    - flatcar/Flatcar
    - flatcar/scripts
    - microsoft/azure-container-linux
    - microsoft/azurelinux
    - bottlerocket-os/bottlerocket
    - amazonlinux/amazon-linux-2023
    - amazonlinux/amazon-linux-2027
    - coreos/coreos-assembler
    - coreos/fedora-coreos-config
    - coreos/fedora-coreos-streams
    - coreos/rhel-coreos-config
    - openshift/os
    # Small repos, high signal: mkosi builds the images, and the UAPI specs are
    # where boot/partition/UKI behaviour is actually decided.
    - systemd/mkosi
    - uapi-group/specifications
    - bootc-dev/bootc
    - bootc-dev/bootc-operator
    - coreos/chunkah
    - coreos/bootupd
    # Small repos, high signal: Fedora's default OCI runtime, where the wasm
    # and VM-runtime extension work lands.
    - containers/crun

  watch:
    - flatcar/nebraska
    - flatcar/sysext-bakery
    - siderolabs/talos
    - kairos-io/kairos
    - kairos-io/hadron
    - openSUSE/microos-tools
    - openSUSE/sysextmgr
    - openSUSE/combustion
    - rancher/elemental
    - rancher/elemental-toolkit
    - coreos/ignition
    - coreos/butane
    - coreos/afterburn
    - coreos/zincati
    - bottlerocket-os/twoliter
    - fedora/bootc/base-images
    - fedora/bootc/docs
    # 170 items a week, mostly not image-mode. Titles only: enough to spot
    # sysupdate/UKI/portable/mkosi work without the comment volume.
    - systemd/systemd
    - uapi-group/kernel-features
    # Amazon Linux keeps code out of its tracker repos; this is where the
    # distro actually lands. Small, low-volume repos: issue/PR metadata only.
    # The kernel fork (amazonlinux/linux) is deliberately absent -- the model
    # has no commit/branch collector, so it would yield nothing.
    - amazonlinux/amazon-ec2-utils
    - amazonlinux/amazon-ec2-net-utils
    - amazonlinux/dnf-plugin-support-info
    - amazonlinux/smart-restart
    - amazonlinux/update-motd
    - amazonlinux/amazon-linux-supportinfo
    - amazonlinux/kiwi-image-descriptions-examples
    # --- container & OCI ecosystem: image/FS layer ---
    # Not core: watch collects releases plus issue/PR metadata, which is
    # enough to see movement without spending the comment budget.
    - composefs/composefs
    - ostreedev/ostree
    - coreos/rpm-ostree
    - osbuild/osbuild
    - osbuild/image-builder
    - flightctl/flightctl
    # --- container tools and engines ---
    - podman-container-tools/podman
    - podman-container-tools/buildah
    - podman-container-tools/skopeo
    - containers/toolbox
    - containers/container-selinux
    - cri-o/cri-o
    - containerd/containerd
    - moby/buildkit
    # --- OCI specification: spec issues are the product ---
    - opencontainers/runtime-spec
    - opencontainers/image-spec
    - opencontainers/distribution-spec
    - opencontainers/runc
    # --- registries and signing ---
    - distribution/distribution
    - project-zot/zot
    - oras-project/oras
    - sigstore/cosign
    - wolfi-dev/os
    - wolfi-dev/wolfictl
    - confidential-containers/confidential-containers

  release-only:
    - ublue-os/bluefin
    - ublue-os/bluefin-lts
    - ublue-os/ucore
    - ublue-os/aurora
    - ublue-os/main
    - ublue-os/bazzite
    - bottlerocket-os/bottlerocket-core-kit
    - bottlerocket-os/bottlerocket-kernel-kit
    - bottlerocket-os/bottlerocket-project-website
    - amazonlinux/container-images
    - microsoft/AzureLinuxVulnerabilityData
    # --- container & OCI ecosystem: support libraries and satellites ---
    # Releases and tags only. The giants (moby/moby, docker/cli,
    # kubernetes/kubernetes) live here too: thousands of open issues each,
    # so a release timeline is the useful signal, not the discussion.
    - containers/common
    - containers/image
    - containers/storage
    - containers/netavark
    - containers/aardvark-dns
    - containers/conmon
    - containers/fuse-overlayfs
    - containers/shortnames
    - containers/udica
    - containers/bubblewrap
    - podman-desktop/podman-desktop
    - opencontainers/runtime-tools
    - opencontainers/umoci
    - opencontainers/oci-conformance
    - containerd/nerdctl
    - moby/moby
    - docker/cli
    - docker/buildx
    - kubernetes/kubernetes
    - sigstore/rekor
    - sigstore/fulcio
    - sigstore/sigstore
    - in-toto/in-toto
    - notaryproject/notary
    - buildpacks/pack
    - buildpacks/lifecycle
    - ko-build/ko
    - google/go-containerregistry
    - GoogleContainerTools/distroless
    - wolfi-dev/secdb
    - chainguard-images/images
    - google/gvisor
    - kata-containers/kata-containers
    - confidential-containers/attestation-agent
    - confidential-containers/guest-components
