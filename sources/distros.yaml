# atomic-l0g source registry
# ==========================
#
# One entry per project. Adding a project is a YAML edit -- no code change.
#
#   vendor            upstream owner, for reporting
#   lineage           where the project's code and design came from
#   update_mechanism  how images are updated in place
#   repos             provider -> [owner/name, ...]
#   feeds             label -> RSS/Atom URL
#   release_endpoints structured release sources
#
# Cost control lives in repos.yaml (tiers); noise filtering in bots.yaml.
#
# Projects marked BASELINE are the comparison baseline: without them there is
# nothing to compare the competitors against. Delete the group to drop it.

# --------------------------------------------------------------------------
# Competitors
# --------------------------------------------------------------------------

flatcar:
  vendor: Microsoft
  lineage: [CoreOS Container Linux]
  update_mechanism: Omaha (nebraska)
  repos:
    github:
      - flatcar/Flatcar
      - flatcar/scripts
      - flatcar/nebraska
      - flatcar/sysext-bakery
  feeds:
    blog: https://flatcar.org/blog/index.xml
  release_endpoints:
    - type: flatcar-releases-json
      url: https://flatcar.org/releases-json/releases.json

azure-container-linux:
  vendor: Microsoft
  lineage: [Flatcar Container Linux, Azure Linux]
  update_mechanism: Omaha (nebraska)
  repos:
    github:
      - microsoft/azure-container-linux

azure-linux:
  vendor: Microsoft
  lineage: [CBL-Mariner]
  update_mechanism: dnf, image-based via ACL
  repos:
    github:
      - microsoft/azurelinux
      - microsoft/AzureLinuxVulnerabilityData

bottlerocket:
  vendor: AWS
  update_mechanism: Bottlerocket update API (A/B partitions)
  repos:
    github:
      - bottlerocket-os/bottlerocket
      - bottlerocket-os/twoliter
      - bottlerocket-os/bottlerocket-core-kit
      - bottlerocket-os/bottlerocket-kernel-kit
      - bottlerocket-os/bottlerocket-project-website
  release_endpoints:
    - type: github-changelog
      url: https://raw.githubusercontent.com/bottlerocket-os/bottlerocket/develop/CHANGELOG.md

amazon-linux:
  vendor: AWS
  lineage: [Amazon Linux 2]
  update_mechanism: dnf
  repos:
    github:
      # 2023/2027 are release notes + the public issue tracker -- where distro
      # feedback and bug reports land -- not where code is written. container-
      # images is an artifact store. The actual Amazon Linux engineering lives
      # in the small OS-side repos below.
      - amazonlinux/amazon-linux-2023
      - amazonlinux/amazon-linux-2027
      - amazonlinux/container-images
      - amazonlinux/amazon-ec2-utils
      - amazonlinux/amazon-ec2-net-utils
      - amazonlinux/dnf-plugin-support-info
      - amazonlinux/smart-restart
      - amazonlinux/update-motd
      - amazonlinux/amazon-linux-supportinfo
      - amazonlinux/kiwi-image-descriptions-examples
  release_endpoints:
    - type: amazonlinux-release-notes
      url: https://docs.aws.amazon.com/linux/al2023/release-notes/relnotes.html

talos:
  vendor: Sidero Labs
  update_mechanism: Talos machine config (A/B image upgrade)
  repos:
    github:
      - siderolabs/talos
  feeds:
    blog: https://www.siderolabs.com/feed/

kairos:
  vendor: Kairos
  update_mechanism: Kairos upgrade (container-based OS)
  repos:
    github:
      - kairos-io/kairos
      - kairos-io/hadron
  feeds:
    blog: https://kairos.io/blog/rss.xml

universal-blue:
  vendor: Universal Blue
  lineage: [Fedora Atomic, bootc]
  update_mechanism: bootc
  repos:
    github:
      - ublue-os/bluefin
      - ublue-os/bluefin-lts
      - ublue-os/ucore
      - ublue-os/aurora
      - ublue-os/main
      - ublue-os/bazzite

opensuse-microos:
  vendor: SUSE
  update_mechanism: transactional-update (btrfs snapshots)
  repos:
    github:
      - openSUSE/microos-tools
      - openSUSE/sysextmgr
      - openSUSE/combustion
  feeds:
    news: https://news.opensuse.org/feed/

rancher-elemental:
  vendor: SUSE Rancher
  update_mechanism: Elemental operator (A/B image upgrade)
  repos:
    github:
      - rancher/elemental
      - rancher/elemental-toolkit

aws-blogs:
  vendor: AWS
  feeds:
    containers: https://aws.amazon.com/blogs/containers/feed/
    opensource: https://aws.amazon.com/blogs/opensource/feed/

# --------------------------------------------------------------------------
# The systemd ecosystem
#
# Amutable is a company founded by the systemd maintainers plus the founder of
# Kinvolk (which built Flatcar), working on build/boot/runtime integrity. It
# publishes no code of its own: the work lands upstream, which is why the
# project has feeds and no repositories, and why the two projects below matter.
# --------------------------------------------------------------------------

amutable:
  vendor: Amutable
  lineage: [systemd, Kinvolk]
  update_mechanism: sysupdate
  feeds:
    blog: https://amutable.com/rss.xml
    # lore.kernel.org serves search results as Atom, which is how kernel work
    # becomes collectable at all -- it has no forge. The From filter is a
    # substring match, so `f:amutable.com` also catches per-person kernel.org
    # aliases like devnull+daan.amutable.com@kernel.org. Brauner submits from
    # brauner@kernel.org, hence the OR.
    kernel:
      url: "https://lore.kernel.org/all/?q=f:amutable.com%20OR%20f:brauner@kernel.org&x=A"
      kind: patch

systemd:
  vendor: systemd project
  update_mechanism: sysupdate, systemd-sysupdate
  repos:
    github:
      - systemd/systemd
      - systemd/mkosi

uapi-group:
  vendor: UAPI Group
  lineage: [systemd]
  repos:
    github:
      - uapi-group/specifications
      - uapi-group/kernel-features

