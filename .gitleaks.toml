title = "atomic-l0g gitleaks configuration"

# The Red Hat PwnedAlert scanner and rh-gitleaks only use this top-level
# [allowlist] section; every other section in this file is ignored there.
# Matches paths relative to the repo root, and also absolute paths.
[allowlist]
description = "Scraped public-source data (data/normalized/)"
# data/normalized/ holds content scraped from public sources (blogs, release
# notes, issue and PR text) and is regenerated by the ingest pipeline. Nothing
# secret of ours can end up there, and scanning it produces false positives on
# other people's posted keys and tokens.
paths = [
  '''(^|/)data/normalized(/|$)''',
]

# Only used by upstream gitleaks v8+ (e.g. after the planned upgrade): a custom
# config replaces the built-in ruleset unless it opts back in, and a scan with
# zero rules reports "no leaks found" for everything. PwnedAlert and rh-gitleaks
# ignore this section.
[extend]
useDefault = true
