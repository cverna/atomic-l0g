[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atomic-l0g"
version = "0.1.0"
description = "Consolidate the image-based Linux ecosystem into a queryable store for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Clement Verna", email = "cverna@tutanota.com" }]
keywords = ["bootc", "image-mode", "coreos", "ecosystem", "activity"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
atomic-l0g = "atomic_l0g.cli:app"
al0g = "atomic_l0g.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atomic_l0g"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
